{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <!-- Required Meta Tags Always Come First -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Title -->
  <title>ورود ساده | جلو - قالب چند منظوره پاسخگو</title>

  <!-- Favicon -->
  <link rel="shortcut icon" href="./favicon.ico">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- CSS Implementing Plugins -->
  <link rel="stylesheet" href="{% static 'css/vendor.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/font/bootstrap-icons.css' %}">

  <!-- CSS Front Template -->
  <link rel="stylesheet" href="{% static 'css/theme.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/toastify/toastify.css' %}">
</head>   
<body>
<!-- ========== MAIN CONTENT ========== -->
  <main id="content" role="main">
    <!-- Form -->
    <div class="container content-space-3 content-space-t-lg-4 content-space-b-lg-3">
      <div class="flex-grow-1 mx-auto" style="max-width: 28rem;">
        <!-- Heading -->
        <div class="text-center mb-5 mb-md-7">
          <h1 class="h2">رمز عبور را فراموش کرده اید؟</h1>
          <p>آدرس ایمیل خود را در زیر وارد کنید و ما شما را به مسیر درست برگردانیم.</p>
        </div>
        <!-- End Heading -->

        <!-- Form -->
        <form method="post">
            {% csrf_token %}
          <!-- Form -->
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <label class="form-label" for="signupSimpleResetPasswordEmail" tabindex="0">ایمیل شما</label>

              <a class="form-label-link" href="{% url 'accounts:login' %}">
                بازگشت به صفحه ورود
              </a>
            </div>

            <input type="email" class="form-control form-control-lg text-center" name="email"
              id="signupSimpleResetPasswordEmail" tabindex="1" placeholder="ایمیل خود را وارد نمایید"
              aria-label="Enter your email address">
            <span class="invalid-feedback">لطفا یک آدرس ایمیل معتبر وارد کنید.</span>
          </div>
          <!-- End Form -->

          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary btn-lg">ارسال</button>
          </div>
        </form>
        <!-- End Form -->
      </div>
    </div>
    <!-- End Form -->
  </main>
  <!-- ========== END MAIN CONTENT ========== -->

  <!-- ========== END SECONDARY CONTENTS ========== -->

  <!-- JS Implementing Plugins -->
  <script src="{% static 'js/vendor.min.js' %}"></script>

  <!-- JS Front -->
  <script src="{% static 'js/theme.min.js' %}"></script>

  <!-- JS Front -->
  <script src="{% static 'vendor/toastify/toastify.js' %}"></script>

 

  {% include 'messages.html' %}
</body>

</html>
